<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="#09090b" />
  <!-- Outer border -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#27272a" stroke-width="8" />
  
  <!-- Dumbbell / Flow Graphic -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Dumbbell Left Weight -->
    <rect x="20" y="76" width="36" height="160" rx="12" fill="url(#gymGrad)" />
    <rect x="56" y="96" width="24" height="120" rx="8" fill="url(#gymGrad)" />
    
    <!-- Dumbbell Center Bar -->
    <rect x="80" y="140" width="152" height="32" rx="8" fill="#f4f4f5" />
    <!-- Grip ridges -->
    <line x1="120" y1="140" x2="120" y2="172" stroke="#71717a" stroke-width="4" />
    <line x1="136" y1="140" x2="136" y2="172" stroke="#71717a" stroke-width="4" />
    <line x1="152" y1="140" x2="152" y2="172" stroke="#71717a" stroke-width="4" />
    <line x1="168" y1="140" x2="168" y2="172" stroke="#71717a" stroke-width="4" />
    <line x1="184" y1="140" x2="184" y2="172" stroke="#71717a" stroke-width="4" />

    <!-- Dumbbell Right Weight -->
    <rect x="232" y="96" width="24" height="120" rx="8" fill="url(#gymGrad)" />
    <rect x="256" y="76" width="36" height="160" rx="12" fill="url(#gymGrad)" />

    <!-- Lightning / Pulse Energy Overlay -->
    <path d="M 120 70 L 175 70 L 145 125 L 195 125 L 115 240 L 135 155 L 90 155 Z" fill="#38bdf8" opacity="0.9" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f4f4f5" text-anchor="middle" letter-spacing="4">GYMFLOW</text>
</svg>
